# Winlogbeat config for WatchMe (Winlogbeat 8.19.x on Windows).
# Copy this file over the winlogbeat.yml in your Winlogbeat folder, set the password, then follow docs/ELASTIC_SETUP.md.

winlogbeat.event_logs:
  # Logons (4624/4625), group changes (4732...), process creation (4688, if enabled). Backfill 30 days for the baseline.
  - name: Security
    ignore_older: 720h
  # Process starts, network, file, registry, DNS, LSASS access (install Sysmon first; skipped if absent)
  - name: Microsoft-Windows-Sysmon/Operational
    ignore_older: 720h
  # PowerShell script blocks (decoded commands)
  - name: Microsoft-Windows-PowerShell/Operational
    event_id: 4103, 4104
    ignore_older: 168h
  # System log: new service installs (7045), service control
  - name: System
    ignore_older: 720h
  # Application log: software install / uninstall (MsiInstaller 11707/11708/11724, 1033/1034)
  - name: Application
    ignore_older: 720h
  # Scheduled task creation (event 106 / 4698 is in the task log)
  - name: Microsoft-Windows-TaskScheduler/Operational
    event_id: 106, 140, 141
    ignore_older: 720h
  # Microsoft Defender detections (1116/1117 malware found / action taken)
  - name: Microsoft-Windows-Windows Defender/Operational
    event_id: 1006, 1007, 1015, 1116, 1117, 1118, 1119
    ignore_older: 720h

# ---------------- Output ----------------
output.elasticsearch:
  hosts: ["http://localhost:9200"]
  username: "elastic"
  password: "changeme"        # same as ELASTIC_PASSWORD in WatchMe's .env
  # Routes Security/Sysmon/PowerShell events through Winlogbeat's ingest pipelines (ECS field mapping)
  pipeline: "winlogbeat-%{[agent.version]}-routing"

# Kibana, for loading Winlogbeat's dashboards (optional)
setup.kibana:
  host: "http://localhost:5601"

setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0   # single-node lab: no replicas, so the index stays green

# Add host metadata (host.name, host.os...) to every event
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded

logging.level: info
logging.to_files: true
logging.files:
  path: C:\ProgramData\winlogbeat\logs
  name: winlogbeat
  keepfiles: 7
